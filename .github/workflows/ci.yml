name: NOVA STUDIO CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://nova:nova@127.0.0.1:5432/nova
  REDIS_URL: redis://127.0.0.1:6379
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_PUBLIC_ENDPOINT: http://127.0.0.1:9000
  S3_REGION: us-east-1
  S3_BUCKET: nova-assets
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio12345
  S3_FORCE_PATH_STYLE: "true"
  WEB_URL: http://localhost:3000
  API_URL: http://127.0.0.1:4000
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000/api/v1
  REALTIME_URL: ws://127.0.0.1:4001
  NEXT_PUBLIC_REALTIME_URL: ws://127.0.0.1:4001
  JWT_ACCESS_SECRET: dev-access-secret-change-in-production-32chars
  JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-32chars
  REALTIME_JWT_SECRET: dev-realtime-secret-change-in-production-32chars
  CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nova -d nova"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15

      minio:
        image: pgsty/silo:latest
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio12345
        ports:
          - 9000:9000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure MinIO bucket exists
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          printf 'user = "%s:%s"\n' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" | curl -s -o /dev/null -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' -K - http://127.0.0.1:9000/$S3_BUCKET

      - name: Prisma generate & migrate
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy

      - name: Lint & Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Run unit & integration tests
        run: pnpm test

      - name: Run API e2e tests
        run: pnpm --filter api test:e2e

      - name: Build all apps & packages
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install chromium --with-deps

      - name: Run Web Playwright smoke suite
        run: pnpm --filter web e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
