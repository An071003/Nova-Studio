services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
    volumes:
      - nova_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nova} -d $${POSTGRES_DB:-nova}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - nova_prod_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          until curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; do sleep 1; done
          printf 'user = "%s:%s"\n' "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" | curl -s -o /dev/null -X PUT --aws-sigv4 'aws:amz:us-east-1:s3' -K - "http://127.0.0.1:9000/$${S3_BUCKET:-nova-assets}"
        ) &
        exec /usr/bin/docker-entrypoint.sh silo server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio12345}
      S3_BUCKET: ${S3_BUCKET:-nova-assets}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ORIGINS:-*}
    ports:
      - "9000:9000"
    volumes:
      - nova_prod_minio:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -sf http://127.0.0.1:9000/minio/health/live && printf "user = \"%s:%s\"\n" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" | curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" -K - -I "http://127.0.0.1:9000/$${S3_BUCKET:-nova-assets}" >/dev/null'
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nova-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      S3_FORCE_PATH_STYLE: "true"
      WEB_URL: ${WEB_URL:-http://localhost}
      API_URL: ${API_URL:-http://api:4000}
      REALTIME_URL: ${REALTIME_PUBLIC_URL:-ws://localhost/ws}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-in-production-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production-32chars}
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-dev-realtime-secret-change-in-production-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  realtime:
    build:
      context: ..
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REALTIME_PORT: 4001
      REALTIME_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REALTIME_JWT_SECRET: ${REALTIME_JWT_SECRET:-dev-realtime-secret-change-in-production-32chars}
      REALTIME_MAX_CONNECTIONS_PER_DOC: ${REALTIME_MAX_CONNECTIONS_PER_DOC:-50}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://nova:nova@postgres:5432/nova}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-nova-assets}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio12345}
      S3_FORCE_PATH_STYLE: "true"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://localhost/ws}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:4000
      WEB_URL: ${WEB_URL:-http://localhost}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      realtime:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nova_prod_caddy_data:/data
      - nova_prod_caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nova_prod_pgdata:
  nova_prod_redis:
  nova_prod_minio:
  nova_prod_caddy_data:
  nova_prod_caddy_config:
